<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHUNITHM 譜面保存ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", sans-serif; padding: 1em; background: #f2f2f2; }
    h1 { font-size: 1.8em; margin-bottom: 0.5em; }
    label { display: block; margin: 0.2em 0; }
    .inline-label { display: inline-block; margin-right: 0.8em; font-size: 0.9em; }
    input[type="text"] { padding: 0.6em; font-size: 1em; border: 1px solid #ccc; border-radius: 5px; width: 95%; }
    input[type="checkbox"] { padding: 0.4em; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 0.6em; font-size: 1em; border: 1px solid #ccc; border-radius: 5px; background-color: #3d3d3d; color: white; cursor: pointer; margin-top: 0.5em; }
    button.save { margin-right: 0.5em; }
    button:hover { background-color: #555555; }
    .input-row { display: flex; align-items: stretch; }
    .input-row input[type="text"] { flex: 1; border-radius: 5px 0 0 5px; height: 42px; box-sizing: border-box; }
    .copy-btn { margin-top: 0; width: 42px; height: 42px; border-radius: 0 5px 5px 0; border: 1px solid #ccc; border-left: none; background-color: #3d3d3d; color: white; cursor: pointer; font-size: 1.1em; display: flex; align-items: center; justify-content: center; padding: 0; box-sizing: border-box; }
    .copy-btn:hover { background-color: #555555; }
    .version { font-size: 0.5em; margin-left: 0.3em; }
    .container { background: white; padding: 1.5em; border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
    .section { margin-bottom: 1.5em; }
    .note { font-size: 0.9em; color: #555; margin: 0.5em 0; }
    #preview { margin-top: 1em; text-align: center; }
    #preview img { max-width: 100%; height: auto; }
    ul#suggestions { list-style: none; padding: 0; margin-top: 0.5em; }
    ul#suggestions li { display: flex; align-items: center; padding: 0.5em; background: #eee; margin-bottom: 0.3em; cursor: pointer; border-radius: 5px; font-size: 0.95em; }
    ul#suggestions li:hover { background: #ddd; }
    .suggestion-item { display: flex; align-items: center; padding: 0.5em; background: #eee; margin-bottom: 0.3em; cursor: pointer; border-radius: 5px; font-size: 0.95em; }
    .suggestion-item:hover { background: #ddd; }
    .diff-label { min-width: 2.2em; margin-right: 0.5em; font-weight: bold; color: white; padding: 0.2em 0.5em; border-radius: 4px; text-align: center; }
    .level-label { min-width: 1.8em; margin-right: 0.5em; font-weight: bold; text-align: left; color: #333; }
    .song-title { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .direct-link-btn { flex: 0 0 30px; width: 30px; height: 30px; margin: 0 0 0 0.5em; padding: 0; border: 1px solid #ccc; border-radius: 4px; background-color: #757575; color: white; cursor: pointer; font-size: 0.95em; line-height: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; box-shadow: 0 1px 1px rgba(0,0,0,0.04); }
    .direct-link-btn:hover { background-color: #555555; }
    .direct-link-btn:active { background-color: #666666; }
    .youtube-btn { flex: 0 0 30px; width: 30px; height: 30px; margin: 0 0 0 0.35em; padding: 0; border: 1px solid #aaa; border-radius: 4px; background-color: #777; color: white; cursor: pointer; font-size: 0.9em; line-height: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    .youtube-btn.has-youtube { background-color: #e62117; border-color: #c91c13; }
    .youtube-btn.has-youtube:hover { background-color: #c91c13; }
    .youtube-btn:disabled { cursor: not-allowed; opacity: 0.45; }
    @media screen and (max-width: 500px) {
      .inline-label { font-size: 0.8em; }
      input[type="text"], input[type="checkbox"] { font-size: 0.8em; }
      button { font-size: 0.9em; }
      .diff-label { font-size: 0.7em; }
      .level-label { font-size: 0.75em; }
      .song-title { font-size: 0.85em; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>CHUNITHM 譜面検索/DLツール <span class="version">v2.0.0</span></h1>

    <div class="section">
      <div class="note">
        譜面画像は
        <a href="https://sdvx.in/chunithm.php" target="_blank">CHUNITHM譜面保管所</a>
        から取得しています。
      </div>
    </div>

    <div class="section">
      <label>譜面種別フィルター:</label>
      <label class="inline-label"><input type="checkbox" id="filterMAS"> MAS</label>
      <label class="inline-label"><input type="checkbox" id="filterULT"> ULT</label>
      <label class="inline-label"><input type="checkbox" id="filterWE"> WE</label>
    </div>

    <div class="section">
      <label>曲名検索:</label>
      <div class="input-row">
        <input type="text" id="search" placeholder="入力すると候補が表示されます...">
        <button type="button" class="copy-btn" onclick="copyText('search', this)">📋</button>
      </div>
      <ul id="suggestions" style="display: none;"></ul>
    </div>

    <div class="section">
      <label>譜面URLを直接入力する場合:</label>
      <div class="input-row">
        <input type="text" id="url" placeholder="https://sdvx.in/chunithm/_/viewer.php?id=11066&amp;diff=mst">
        <button type="button" class="copy-btn" onclick="copyText('url', this)">📋</button>
      </div>
    </div>

    <div class="section">
      <details id="recentSongs" style="margin: 1em 0;">
        <summary style="cursor:pointer; font-weight:bold;">
          最近追加された譜面:
        </summary>
        <div id="recentContainer"></div>
      </details>
      <details id="recentArchiveSongs" style="margin: 1em 0;">
        <summary style="cursor:pointer;">
          過去に追加された譜面:
        </summary>
        <div id="recentArchiveContainer"></div>
      </details>

      <button class="save" onclick="fetchAndSaveChart()">📥 譜面を見る</button>
      <button id="resetBtn">入力リセット</button>
    </div>

    <div class="note">
      ・2026/10/25時点で登録されている譜面に対応しました。<br>
      ・スペース有無を無視した検索に対応しています。<br>
      ・一部保存できない譜面があります。ご了承ください。
    </div>

    <div id="preview"></div>
  </div>

  <script>
    const songList = [];

    // 静的JSONが差し替えられた後も古いHTTPキャッシュを使わない。
    async function fetchFreshJson(path) {
      const separator = path.includes('?') ? '&' : '?';
      const response = await fetch(`${path}${separator}_=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.json();
    }

    async function loadSongList() {
      try {
        const data = await fetchFreshJson('./prev_chunithm_songs.json');
        if (!Array.isArray(data)) throw new Error('譜面データが配列ではありません');
        // 検索キーとハイライト情報をロード時に一度だけ計算し、入力中の重い正規化を避ける。
        for (const song of data) {
          song._searchKeys = buildSearchKeys(song);
          song._nameSearchInfo = normalizeSearchWithMap(String(song.name || ''));
        }
        songList.push(...data);
        document.getElementById('search').dispatchEvent(new Event('input'));
      } catch (err) {
        alert("譜面データの読み込みに失敗しました。JSONファイルを確認してください。");
        console.error(err);
      }
    }

    // 検索用の正規化:
    // ・英字のアクセント等を除去
    // ・一部の「文字の代わりに使われている記号」を英字へ変換
    // ・ギリシャ文字はローマ字相当へ変換
    const SEARCH_SYMBOL_MAP = {
      '✪': 'O',
      '∅': 'O',
      '@': 'A',
      '＠': 'A',
      'Я': 'R',
      'я': 'r',
      'Ø': 'O',
      'ø': 'o',
      'Ł': 'L',
      'ł': 'l',
      'Đ': 'D',
      'đ': 'd',
      'Ð': 'D',
      'ð': 'd',
      'Þ': 'TH',
      'þ': 'th',
      'Æ': 'AE',
      'æ': 'ae',
      'Œ': 'OE',
      'œ': 'oe',
      'ß': 'ss',
      'ı': 'i'
    };

    const GREEK_MAP = {
      'Α':'A','Β':'B','Γ':'G','Δ':'D','Ε':'E','Ζ':'Z','Η':'I','Θ':'TH',
      'Ι':'I','Κ':'K','Λ':'A','Μ':'M','Ν':'N','Ξ':'X','Ο':'O','Π':'P',
      'Ρ':'R','Σ':'S','Τ':'T','Υ':'Y','Φ':'F','Χ':'CH','Ψ':'PS','Ω':'O',
      'Ά':'A','Έ':'E','Ή':'I','Ί':'I','Ό':'O','Ύ':'Y','Ώ':'O',
      'α':'a','β':'b','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th',
      'ι':'i','κ':'k','λ':'a','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p',
      'ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o',
      'ά':'a','έ':'e','ή':'i','ί':'i','ό':'o','ύ':'y','ώ':'o'
    };

    // 特別措置
    const SEARCH_ALIASES = {
      'Ωκεανος': ['Okeanos', 'オーケアノス'],
      'χρόνος': ['Chronos', 'クロノス']
    };

    function isJapaneseBaseChar(ch) {
      if (!ch) return false;
      const cp = ch.codePointAt(0);
      return (
        (cp >= 0x3040 && cp <= 0x309F) || // ひらがな
        (cp >= 0x30A0 && cp <= 0x30FF)    // カタカナ
      );
    }

    function normalizeSearchWithMap(text) {
      const chars = [];
      const map = [];

      for (let i = 0; i < text.length; ) {
        const codePoint = text.codePointAt(i);
        const originalChar = String.fromCodePoint(codePoint);
        const originalIndex = i;
        i += originalChar.length;

        let mapped = SEARCH_SYMBOL_MAP[originalChar]
          ?? GREEK_MAP[originalChar]
          ?? originalChar;

        mapped = mapped.normalize('NFKC');

        for (const decomposedChar of mapped.normalize('NFD')) {
          if (/^\p{M}$/u.test(decomposedChar)) {
            // 日本語の濁点・半濁点は維持
            const previous = chars.length ? chars[chars.length - 1] : '';
            if (isJapaneseBaseChar(previous)) {
              chars.push(decomposedChar);
              map.push(originalIndex);
            }
            continue;
          }

          // Unicodeの「文字」または「数字」は残し、それ以外は検索上無視
          if (/^[\p{L}\p{N}]$/u.test(decomposedChar)) {
            chars.push(decomposedChar.toLowerCase());
            map.push(originalIndex);
          }
        }
      }

      return { chars, map };
    }

    function normalizeSearchText(text) {
      return normalizeSearchWithMap(text).chars.join('');
    }

    function buildSearchKeys(song) {
      // 曲名そのものと、読み仮名・英字表記などの検索補助キーを分けてキャッシュする。
      // artist_search_hira / artist_search_abc / composer は意図的に検索対象外。
      song._directSearchName = normalizeSearchText(String(song.name || ''));
      const alternateValues = [
        song.title_search_hira,
        song.title_search_abc,
        ...(SEARCH_ALIASES[song.name] || [])
      ];
      song._alternateSearchKeys = [...new Set(
        alternateValues
          .filter(value => typeof value === 'string' && value.trim())
          .map(normalizeSearchText)
          .filter(Boolean)
      )];
      return [...new Set([song._directSearchName, ...song._alternateSearchKeys].filter(Boolean))];
    }

    function getSearchKeys(song) {
      // 読み込み時に作ったキャッシュを返す。入力のたびに2400曲分の正規化をしない。
      return Array.isArray(song?._searchKeys) ? song._searchKeys : buildSearchKeys(song);
    }

    function getSongSearchRank(song, input, inputLength) {
      // 優先順位: 曲名完全一致 > 曲名先頭一致 > 曲名途中一致 > 別表記先頭一致 > 別表記途中一致。
      // 1文字検索は先頭一致だけに限定し、部分一致の大量ヒットを防ぐ。
      const direct = typeof song._directSearchName === 'string'
        ? song._directSearchName
        : normalizeSearchText(String(song.name || ''));
      const alternate = Array.isArray(song._alternateSearchKeys)
        ? song._alternateSearchKeys
        : getSearchKeys(song).filter(key => key !== direct);

      if (direct === input) return 0;
      if (direct.startsWith(input)) return 1;
      if (inputLength > 1 && direct.includes(input)) return 2;
      if (alternate.some(key => key.startsWith(input))) return 3;
      if (inputLength > 1 && alternate.some(key => key.includes(input))) return 4;
      return -1;
    }

    function normalizeChartId(id) {
      const value = String(id ?? '').trim();
      return /^\d+$/.test(value) ? (value.replace(/^0+/, '') || '0') : value;
    }

    function normalizeChartCode(code) {
      const value = String(code ?? '').trim().toLowerCase();
      if (value === 'mst' || value === 'mas' || value === 'master') return 'mst';
      if (value === 'ult') return 'ult';
      if (value === 'we' || value.startsWith('end')) return 'we';
      return '';
    }

    function chartIdentity(item) {
      let id = String(item?.id ?? '').trim();
      let code = normalizeChartCode(item?.chart_code) || normalizeChartCode(item?.diff);
      const rawUrl = String(item?.url ?? '').trim();

      if (rawUrl) {
        try {
          const parsed = new URL(rawUrl, window.location.href);
          if (parsed.pathname.replace(/\/$/, '').endsWith('/viewer.php')) {
            id = (parsed.searchParams.get('id') || id).trim();
            code = normalizeChartCode(parsed.searchParams.get('diff')) || code;
          } else {
            const match = parsed.pathname.match(/\/(\d+)(mst|ult|end\d?)\.htm$/i);
            if (match) {
              id = match[1];
              code = normalizeChartCode(match[2]) || code;
            }
          }
        } catch (_) {
          const match = rawUrl.match(/(\d+)(mst|ult|end\d?)\.htm(?:$|[?#])/i);
          if (match) {
            id = match[1];
            code = normalizeChartCode(match[2]) || code;
          }
        }
      }

      const canonicalId = normalizeChartId(id);
      return canonicalId && code ? `${canonicalId}:${code}` : '';
    }

    function resolveSongForItem(item) {
      const key = chartIdentity(item);
      if (key) {
        const matching = songList.find(song => chartIdentity(song) === key);
        if (matching) return matching;
      }
      if (item?.url) return songList.find(song => song.url === item.url) || null;
      return null;
    }

    function resolveYoutubeId(item) {
      // 複数リンクがある場合は2本目（速度9.0想定）を優先する。
      const ids = Array.isArray(item?.youtube_ids)
        ? item.youtube_ids.map(value => String(value ?? '').trim()).filter(value => /^[A-Za-z0-9_-]{11}$/.test(value))
        : [];
      if (ids.length >= 2) return ids[1];
      if (ids.length === 1) return ids[0];
      const primary = String(item?.youtube_id ?? '').trim();
      if (/^[A-Za-z0-9_-]{11}$/.test(primary)) return primary;

      const matched = resolveSongForItem(item);
      if (matched && matched !== item) {
        const matchedIds = Array.isArray(matched.youtube_ids)
          ? matched.youtube_ids.map(value => String(value ?? '').trim()).filter(value => /^[A-Za-z0-9_-]{11}$/.test(value))
          : [];
        if (matchedIds.length >= 2) return matchedIds[1];
        if (matchedIds.length === 1) return matchedIds[0];
        const id = String(matched.youtube_id ?? '').trim();
        if (/^[A-Za-z0-9_-]{11}$/.test(id)) return id;
      }
      return '';
    }

    function setupYoutubeButton(button, item) {
      const youtubeId = resolveYoutubeId(item);
      if (youtubeId) {
        button.disabled = false;
        button.classList.add('has-youtube');
        button.title = 'YouTubeで動画を見る';
        button.setAttribute('aria-label', 'YouTubeで動画を見る');
      } else {
        button.disabled = true;
        button.classList.remove('has-youtube');
        button.title = 'YouTube動画リンクなし';
        button.setAttribute('aria-label', 'YouTube動画リンクなし');
      }
      button.addEventListener('click', event => {
        event.stopPropagation();
        const id = resolveYoutubeId(item);
        if (!id) return;
        window.open(`https://www.youtube.com/watch?v=${encodeURIComponent(id)}`, '_blank', 'noopener,noreferrer');
      });
    }

    function findPrimaryMatch(song, normalizedInput) {
      const info = normalizeSearchWithMap(song.name);
      const inputChars = Array.from(normalizedInput);

      if (inputChars.length === 0) return -1;

      outer:
      for (let i = 0; i <= info.chars.length - inputChars.length; i++) {
        for (let j = 0; j < inputChars.length; j++) {
          if (info.chars[i + j] !== inputChars[j]) continue outer;
        }
        return i;
      }
      return -1;
    }

    function highlightNormalizedMatch(originalName, normalizedInput, cachedInfo = null) {
      const info = cachedInfo || normalizeSearchWithMap(originalName);
      const inputChars = Array.from(normalizedInput);

      if (inputChars.length === 0) return originalName;

      let matchIndex = -1;
      outer:
      for (let i = 0; i <= info.chars.length - inputChars.length; i++) {
        for (let j = 0; j < inputChars.length; j++) {
          if (info.chars[i + j] !== inputChars[j]) continue outer;
        }
        matchIndex = i;
        break;
      }

      if (matchIndex === -1) return originalName;

      const matchStart = info.map[matchIndex];
      const matchEnd = info.map[matchIndex + inputChars.length - 1];

      if (matchStart == null || matchEnd == null) return originalName;

      return (
        originalName.slice(0, matchStart) +
        '<strong>' +
        originalName.slice(matchStart, matchEnd + 1) +
        '</strong>' +
        originalName.slice(matchEnd + 1)
      );
    }

    function loadPrefs() {
      ['MAS','ULT','WE'].forEach(diff => {
        const cb = document.getElementById('filter'+diff);
        const stored = localStorage.getItem('filter'+diff);
        cb.checked = stored === null ? true : stored === 'true';
        cb.addEventListener('change', () => {
          localStorage.setItem('filter'+diff, cb.checked);
          document.getElementById('search').dispatchEvent(new Event('input')); // チェック変更時再検索
        });
      });
    }

    let searchDebounceTimer = null;
    document.getElementById('search').addEventListener('input', function () {
      const searchField = document.getElementById('search');
      const urlField = document.getElementById('url');
      const rawInput = searchField.value;
      const suggestions = document.getElementById('suggestions');

      // 入力欄の描画を先にブラウザへ返し、候補検索は次の短いタイマーで処理する。
      if (searchDebounceTimer !== null) clearTimeout(searchDebounceTimer);
      if (rawInput.trim() === '') {
        suggestions.innerHTML = '';
        suggestions.style.display = 'none';
        searchField.style.backgroundColor = '';
        urlField.style.backgroundColor = '';
        urlField.value = '';
        return;
      }
      searchDebounceTimer = setTimeout(() => runSongSearch(rawInput), 20);
    });

    function runSongSearch(rawInput) {
      // 古い検索結果が遅れて出ないよう、現在の入力値と一致する場合だけ描画する。
      const searchField = document.getElementById('search');
      if (searchField.value !== rawInput) return;
      const urlField = document.getElementById('url');
      const input = normalizeSearchText(rawInput);
      const suggestions = document.getElementById('suggestions');

      if (input === '') {
        suggestions.innerHTML = '';
        suggestions.style.display = 'none';
        searchField.style.backgroundColor = '';
        urlField.style.backgroundColor = '';
        urlField.value = '';
        return;
      }

      const masEnabled = document.getElementById('filterMAS').checked;
      const ultEnabled = document.getElementById('filterULT').checked;
      const weEnabled = document.getElementById('filterWE').checked;
      const inputLength = Array.from(input).length;
      const limit = 99;
      const rankedResults = [[], [], [], [], []];

      // 1回走査し、直接の曲名一致を読み仮名・英字表記の一致より前に表示する。
      for (const song of songList) {
        if ((song.diff === 'MAS' && !masEnabled) ||
            (song.diff === 'ULT' && !ultEnabled) ||
            (song.diff === 'WE' && !weEnabled)) continue;

        const rank = getSongSearchRank(song, input, inputLength);
        if (rank >= 0 && rankedResults[rank].length < limit) {
          rankedResults[rank].push(song);
        }
      }

      const results = [];
      for (const group of rankedResults) {
        const remaining = limit - results.length;
        if (remaining <= 0) break;
        results.push(...group.slice(0, remaining));
      }
      suggestions.innerHTML = '';
      if (results.length === 0) {
        suggestions.style.display = 'none';
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const song of results) {
        const li = document.createElement('li');
        const displayName = highlightNormalizedMatch(song.name, input, song._nameSearchInfo);
        const diffColor = {
          MAS: "#a0a",
          ULT: "#862333",
          WE:  "#273eba"
        }[song.diff] || "#333";

        li.innerHTML = `
          <span class="diff-label" style="background:${diffColor}">${song.diff}</span>
          <span class="level-label">${song.level || '?'}</span>
          <span class="song-title">${displayName}</span>
          <button type="button" class="youtube-btn" title="YouTube動画リンクなし" aria-label="YouTube動画リンクなし" disabled>▶</button>
          <button type="button" class="direct-link-btn" title="譜面を見る" aria-label="譜面を見る">↗</button>
        `;
        setupYoutubeButton(li.querySelector('.youtube-btn'), song);
        li.onclick = () => {
          setSongFields(song);
          suggestions.innerHTML = '';
          suggestions.style.display = 'none';
        };
        li.querySelector('.direct-link-btn').onclick = (event) => {
          event.stopPropagation();
          setSongFields(song);
          fetchAndSaveChart();
        };
        fragment.appendChild(li);
      }
      suggestions.appendChild(fragment);
      suggestions.style.display = 'block';
    }

    document.getElementById('url').addEventListener('input', function () {
      clearHighlightIfEmpty('url');
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('search').value = '';
      document.getElementById('url').value = '';
      ['search','url'].forEach(id => document.getElementById(id).style.backgroundColor = '');
    });

    async function fetchAndSaveChart() {
      const url = document.getElementById('url').value.trim();
      if (!url.startsWith('http')) return alert('正しい譜面URLを入力してください');

      const parsed = parseChartUrlForImage(url);
      if (!parsed || !parsed.id || !parsed.code) {
        return alert('譜面URLの形式が正しくありません。viewer.php?id=曲ID&diff=mst/ult/we の形式を確認してください。');
      }

      // URLのクエリ順序が違う場合や旧.htm URLでも、ID＋譜面種別で検索する。
      const song = resolveSongForItem({ url });
      const songId = String(song?.id || parsed.id);
      const diffCode = String(song?.chart_code || parsed.imageCode || parsed.code);
      const imagePath = `resized_charts/${songId}${diffCode}.png`;
      const title = song ? song.name : `${songId}${diffCode}`;

      const newTab = window.open('', '_blank');
      if (!newTab) {
        alert('ポップアップがブロックされました。許可してください。');
        return;
      }

      newTab.document.write(`
        <html>
          <head>
            <meta charset="utf-8">
            <title>${title}</title>
            <style>
              body { margin: 0; background: rgba(0,0,0,.85); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; font-family: sans-serif; font-size: 14px; }
            </style>
          </head>
          <body>読み込み中...</body>
        </html>
      `);
      newTab.document.close();

      try {
        const img = await loadImage(imagePath);
        renderChartImage(newTab, img, title);
      } catch (e) {
        newTab.document.body.textContent = '画像の読み込みに失敗しました。譜面データが存在しない可能性があります。';
        console.error(e);
      }
    }

    function renderChartImage(newTab, loadedImage, title) {
      const doc = newTab.document;
      doc.body.innerHTML = '';
      doc.title = title;

      // モバイル側はこれまでの表示のまま（ブラウザ標準のピンチズームを維持）。
      const desktopWheelZoom = typeof newTab.matchMedia === 'function' &&
        newTab.matchMedia('(hover: hover) and (pointer: fine)').matches;
      const image = doc.createElement('img');
      image.src = loadedImage.src;
      image.alt = title;
      image.style.boxShadow = '0 0 20px rgba(255,255,255,0.2)';

      if (!desktopWheelZoom) {
        image.style.maxWidth = '100%';
        image.style.height = 'auto';
        doc.body.appendChild(image);
        return;
      }

      // PC: ホイールでカーソル位置を中心にズーム。拡大後はドラッグで移動できる。
      doc.body.style.cssText = 'margin:0; padding:0; overflow:hidden; background:rgba(0,0,0,.92);';
      const viewer = doc.createElement('div');
      viewer.style.cssText = 'position:fixed; inset:0; overflow:hidden; cursor:grab; touch-action:auto; user-select:none;';
      doc.body.appendChild(viewer);
      image.draggable = false;
      image.style.position = 'absolute';
      image.style.left = '0';
      image.style.top = '0';
      image.style.maxWidth = 'none';
      image.style.width = `${loadedImage.naturalWidth}px`;
      image.style.height = `${loadedImage.naturalHeight}px`;
      image.style.transformOrigin = '0 0';
      image.style.boxShadow = '0 0 20px rgba(255,255,255,0.2)';
      viewer.appendChild(image);

      const hint = doc.createElement('div');
      hint.textContent = 'ホイール：拡大・縮小 ／ ドラッグ：移動';
      hint.style.cssText = 'position:fixed; top:10px; right:12px; z-index:2; padding:6px 9px; border-radius:5px; background:rgba(0,0,0,.55); color:#fff; font:12px sans-serif; pointer-events:none;';
      viewer.appendChild(hint);

      let scale = 1;
      let translateX = 0;
      let translateY = 0;
      let drag = null;
      const naturalWidth = loadedImage.naturalWidth;
      const naturalHeight = loadedImage.naturalHeight;

      const applyTransform = () => {
        image.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      };
      const fitToViewport = () => {
        const width = viewer.clientWidth || newTab.innerWidth;
        const height = viewer.clientHeight || newTab.innerHeight;
        scale = Math.min(width / naturalWidth, height / naturalHeight, 1);
        translateX = (width - naturalWidth * scale) / 2;
        translateY = (height - naturalHeight * scale) / 2;
        applyTransform();
      };

      image.addEventListener('load', fitToViewport, { once: true });
      // キャッシュから即時ロード済みの場合にも初期フィットを適用。
      if (image.complete) fitToViewport();
      newTab.addEventListener('resize', fitToViewport);

      viewer.addEventListener('wheel', event => {
        event.preventDefault();
        const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
        const nextScale = Math.max(0.1, Math.min(8, scale * factor));
        if (nextScale === scale) return;
        const ratio = nextScale / scale;
        translateX = event.clientX - (event.clientX - translateX) * ratio;
        translateY = event.clientY - (event.clientY - translateY) * ratio;
        scale = nextScale;
        applyTransform();
      }, { passive: false });

      viewer.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        drag = { x: event.clientX, y: event.clientY, tx: translateX, ty: translateY };
        viewer.style.cursor = 'grabbing';
        viewer.setPointerCapture(event.pointerId);
      });
      viewer.addEventListener('pointermove', event => {
        if (!drag) return;
        translateX = drag.tx + event.clientX - drag.x;
        translateY = drag.ty + event.clientY - drag.y;
        applyTransform();
      });
      const stopDrag = () => {
        drag = null;
        viewer.style.cursor = 'grab';
      };
      viewer.addEventListener('pointerup', stopDrag);
      viewer.addEventListener('pointercancel', stopDrag);
      viewer.addEventListener('lostpointercapture', stopDrag);
    }

    function parseChartUrlForImage(rawUrl) {
      try {
        const parsedUrl = new URL(rawUrl, window.location.href);
        const path = parsedUrl.pathname;
        if (path.replace(/\/$/, '').endsWith('/viewer.php')) {
          const id = (parsedUrl.searchParams.get('id') || '').trim();
          const code = normalizeChartCode(parsedUrl.searchParams.get('diff'));
          return id && code ? { id, code, imageCode: code } : null;
        }
        const match = path.match(/\/(\d+)(mst|ult|end\d?)\.htm$/i);
        if (match) {
          const code = normalizeChartCode(match[2]);
          return { id: match[1], code, imageCode: match[2].toLowerCase() };
        }
      } catch (_) {
        // 下の正規表現で旧URL形式を判定する。
      }
      const oldMatch = rawUrl.match(/(\d+)(mst|ult|end\d?)\.htm(?:$|[?#])/i);
      if (oldMatch) {
        return { id: oldMatch[1], code: normalizeChartCode(oldMatch[2]), imageCode: oldMatch[2].toLowerCase() };
      }
      return null;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`画像読み込み失敗: ${src}`));
        img.src = src;
      });
    }

    function highlightField(id) {
      const el = document.getElementById(id);
      el.style.backgroundColor = '#fff9c4';
    }

    function clearHighlightIfEmpty(id) {
      const el = document.getElementById(id);
      if (el.value.trim() === "") {
        el.style.backgroundColor = '';
      }
    }

    function setSongFields(song) {
      document.getElementById('search').value = song.name;
      document.getElementById('url').value = song.url;
      highlightField('search');
      highlightField('url');
    }

    function createUpdateContent(title, items, useDetails = false) {
      if (useDetails) {
        // 過去分
        const details = document.createElement('details');
        details.style.margin = '0.5em 0 0.5em 1em';

        const summary = document.createElement('summary');
        summary.textContent = `${title}`;
        summary.style.cursor = 'pointer';
        summary.style.fontWeight = 'bold';

        details.appendChild(summary);
        details.appendChild(createSongList(items));
        return details;
      } else {
        // 直近
        const wrapper = document.createElement('div');

        const header = document.createElement('div');
        header.textContent = `${title}`;
        header.style.fontWeight = 'bold';
        header.style.margin = '0.5em 0';

        wrapper.appendChild(header);
        wrapper.appendChild(createSongList(items));
        return wrapper;
      }
    }

    function createSongList(items) {
      const ul = document.createElement('ul');
      ul.style.listStyle = 'none';
      ul.style.padding = '0';

      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'suggestion-item';
        li.innerHTML = `
          <span class="diff-label" style="background:${getColor(item.diff)}">${item.diff}</span>
          <span class="level-label">${item.level || '?'}</span>
          <span class="song-title">${item.name}</span>
          <button type="button" class="youtube-btn" title="YouTube動画リンクなし" aria-label="YouTube動画リンクなし" disabled>▶</button>
          <button type="button" class="direct-link-btn" title="譜面を見る" aria-label="譜面を見る">↗</button>
        `;
        setupYoutubeButton(li.querySelector('.youtube-btn'), item);
        li.onclick = () => {
          setSongFields(item);
        };
        li.querySelector('.direct-link-btn').onclick = (event) => {
          event.stopPropagation();
          setSongFields(item);
          fetchAndSaveChart();
        };
        ul.appendChild(li);
      });

      return ul;
    }

    // diff_songs.json は起動時に曲一覧とは独立して取得する。
    // ページ復帰時にも再取得するため、通信中の重複呼び出しを抑止する。
    let recentLoadInProgress = false;
    async function loadRecentSongs() {
      if (recentLoadInProgress) return;
      recentLoadInProgress = true;
      try {
        const data = await fetchFreshJson('./diff_songs.json');
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
          throw new Error('diff_songs.json の形式が正しくありません');
        }

        const latestContainer = document.getElementById('recentContainer');
        const archiveContainer = document.getElementById('recentArchiveContainer');
        const recentDetails = document.getElementById('recentSongs');

        latestContainer.innerHTML = '';
        archiveContainer.innerHTML = '';

        const titles = Object.keys(data).reverse(); // 新しい順
        if (titles.length === 0) return;

        // 直近の更新
        const latestTitle = titles[0];
        latestContainer.appendChild(
          createUpdateContent(latestTitle, data[latestTitle], false)
        );

        // 過去分の更新
        titles.slice(1).forEach(title => {
          archiveContainer.appendChild(
            createUpdateContent(title, data[title], true)
          );
        });

      } catch (err) {
        console.error('diff_songs.json の読み込みに失敗:', err);
      } finally {
        recentLoadInProgress = false;
      }
    }

    function getColor(diff) {
      return {
        MAS: "#a0a",
        ULT: "#862333",
        WE:  "#273eba"
      }[diff] || "#333";
    }

    function copyText(id, btn) {
      const el = document.getElementById(id);
      const text = el.value.trim();
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "✓";
        setTimeout(() => {
          btn.textContent = "📋";
        }, 1000);
      }).catch(err => {
        // alert("コピーに失敗しました");
        console.error(err);
      });
    }

    // 初期化。最近追加された譜面は重い検索データの準備を待たずに表示する。
    loadPrefs();
    loadSongList();
    loadRecentSongs();

    // スマホでブラウザ/アプリから戻ってきたときも最新の差分JSONを確認。
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRecentSongs();
    });
    window.addEventListener('pageshow', event => {
      if (event.persisted) loadRecentSongs();
    });
  </script>
</body>
</html>
